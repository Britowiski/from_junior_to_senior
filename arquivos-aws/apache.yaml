apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-site-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: meu-site
          image: httpd:latest
          ports:
            - containerPort: 80
      resources:
        requests:
          memory: "64Mi" # O mínimo garantido para o Pod ligar
          cpu: "50m" # 50 milicores (5% de 1 CPU)
        limits:
          memory: "128Mi" # O limite MÁXIMO (Se passar daqui, o K8s mata o Pod)
          cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: meu-site-service
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: apache

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meu-site-ingress
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meu-site-service
                port:
                  number: 80
